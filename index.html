<head>
<meta charset="UTF-8">

<title>دار العطور | Luxury Perfumes</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
scroll-behavior:smooth;
}

body{
background:#030303;
overflow-x:hidden;
color:white;
}

/* خلفية فخمة */

.bg-light{
position:fixed;
width:100%;
height:100%;
z-index:-2;
background:
radial-gradient(circle at top left,#d4af3715,transparent 35%),
radial-gradient(circle at bottom right,#d4af3710,transparent 35%),
#030303;
animation:bgmove 10s infinite alternate;
}

@keyframes bgmove{
0%{
transform:scale(1);
}
100%{
transform:scale(1.08);
}
}

/* البانر */

.hero{
height:100vh;
background:
linear-gradient(to bottom,rgba(0,0,0,.35),rgba(0,0,0,.92)),
url('banner.png');
background-size:cover;
background-position:center;
position:relative;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* دوائر متحركة */

.circle{
position:absolute;
border-radius:50%;
background:rgba(212,175,55,.08);
filter:blur(10px);
animation:float 8s infinite ease-in-out;
}

.circle1{
width:220px;
height:220px;
top:10%;
left:10%;
}

.circle2{
width:160px;
height:160px;
bottom:12%;
right:8%;
animation-delay:2s;
}

.circle3{
width:120px;
height:120px;
top:45%;
right:18%;
animation-delay:4s;
}

@keyframes float{
50%{
transform:translateY(-20px) scale(1.08);
}
}

/* المحتوى */

.hero-content{
text-align:center;
position:relative;
z-index:5;
padding:20px;
animation:fadeUp 1.5s ease;
}

/* اللوجو */

.logo{
width:210px;
height:210px;
border-radius:50%;
border:5px solid #d4af37;
object-fit:cover;
box-shadow:
0 0 25px rgba(212,175,55,.45),
0 0 60px rgba(212,175,55,.2);
animation:logoGlow 3s infinite alternate;
}

@keyframes logoGlow{
100%{
box-shadow:
0 0 35px rgba(212,175,55,.7),
0 0 80px rgba(212,175,55,.35);
}
}

/* النص */

.title{
font-size:70px;
font-weight:800;
margin-top:28px;
color:#d4af37;
text-shadow:0 0 30px rgba(212,175,55,.35);
}

.subtitle{
font-size:28px;
margin-top:10px;
color:#f1ddb1;
letter-spacing:2px;
}

.desc{
margin-top:22px;
font-size:18px;
color:#c5c5c5;
line-height:2;
max-width:650px;
}

/* الأزرار */

.buttons{
margin-top:35px;
display:flex;
flex-direction:column;
gap:18px;
align-items:center;
}

.btn{
width:320px;
max-width:90%;
padding:18px;
border-radius:18px;
text-decoration:none;
font-size:19px;
font-weight:700;
position:relative;
overflow:hidden;
color:white;
background:linear-gradient(135deg,#161616,#0a0a0a);
border:1px solid rgba(212,175,55,.25);
transition:.4s;
backdrop-filter:blur(10px);
box-shadow:0 0 18px rgba(0,0,0,.5);
}

.btn::before{
content:'';
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
transition:.6s;
}

.btn:hover::before{
left:100%;
}

.btn:hover{
transform:translateY(-5px) scale(1.02);
border-color:#d4af37;
box-shadow:0 0 30px rgba(212,175,55,.28);
color:#d4af37;
}

/* رقم التواصل */

.phone{
margin-top:30px;
font-size:24px;
font-weight:800;
color:#d4af37;
text-shadow:0 0 18px rgba(212,175,55,.3);
}

/* الفوتر */

footer{
padding:30px 15px;
text-align:center;
font-size:15px;
color:#777;
background:#050505;
}

/* انيميشن */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(50px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* موبايل */

@media(max-width:700px){

.hero{
height:auto;
padding:90px 0;
}

.logo{
width:165px;
height:165px;
}

.title{
font-size:48px;
}

.subtitle{
font-size:22px;
}

.desc{
font-size:16px;
}

}

</style>
</head>

</div>

</body>
</html>
