<head>
<meta charset="UTF-8">

<title>دار العطور | حضور لا يُنسى</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
scroll-behavior:smooth;
}

body{
background:#050505;
overflow-x:hidden;
color:white;
}

/* خلفية متحركة */

body::before{
content:'';
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at top,#d4af3720,transparent 40%),
radial-gradient(circle at bottom,#d4af3715,transparent 40%);
z-index:-1;
animation:bgmove 8s infinite alternate;
}

@keyframes bgmove{
0%{transform:scale(1);}
100%{transform:scale(1.08);}
}

/* البانر */

.hero{
height:450px;
background:
linear-gradient(to bottom,rgba(0,0,0,.15),rgba(0,0,0,.96)),
url('banner.png');
background-size:cover;
background-position:center;
display:flex;
align-items:center;
justify-content:center;
position:relative;
overflow:hidden;
}

.hero::before{
content:'';
position:absolute;
width:700px;
height:700px;
background:radial-gradient(circle,#d4af3722,transparent 70%);
animation:rotate 14s linear infinite;
}

@keyframes rotate{
100%{
transform:rotate(360deg);
}
}

/* اللوجو */

.logo-box{
display:flex;
justify-content:center;
margin-top:-100px;
position:relative;
z-index:10;
animation:fadeUp 1.5s ease;
}

.logo{
width:200px;
height:200px;
border-radius:50%;
border:5px solid #d4af37;
object-fit:cover;
background:#111;
box-shadow:
0 0 20px rgba(212,175,55,.5),
0 0 50px rgba(212,175,55,.25);
transition:.4s;
}

.logo:hover{
transform:scale(1.05) rotate(2deg);
}

/* المحتوى */

.container{
width:90%;
max-width:520px;
margin:auto;
text-align:center;
padding-bottom:60px;
}

.title{
font-size:58px;
font-weight:800;
color:#d4af37;
margin-top:25px;
text-shadow:0 0 25px rgba(212,175,55,.3);
animation:fadeUp 1.6s ease;
}

.subtitle{
font-size:26px;
color:#d9c48a;
margin-top:8px;
animation:fadeUp 1.9s ease;
}

.address{
margin-top:18px;
font-size:18px;
line-height:1.9;
color:#b5b5b5;
animation:fadeUp 2.2s ease;
}

.line{
width:150px;
height:3px;
margin:30px auto;
border-radius:50px;
background:linear-gradient(to right,transparent,#d4af37,transparent);
animation:glow 2s infinite;
}

@keyframes glow{
50%{
opacity:.4;
transform:scaleX(1.15);
}
}

.section-title{
font-size:42px;
font-weight:800;
color:#d4af37;
margin-bottom:15px;
animation:fadeUp 2.3s ease;
}

/* الكارد */

.card{
background:linear-gradient(145deg,#111,#090909);
border:1px solid rgba(212,175,55,.18);
border-radius:30px;
padding:35px 24px;
backdrop-filter:blur(12px);
box-shadow:
0 0 25px rgba(212,175,55,.08),
0 0 60px rgba(0,0,0,.6);
animation:fadeUp 2.5s ease;
}

.card h3{
font-size:30px;
margin-bottom:12px;
}

.card p{
color:#bdbdbd;
line-height:2;
margin-bottom:28px;
}

/* الأزرار */

.btn{
width:100%;
display:flex;
justify-content:center;
align-items:center;
padding:18px;
margin-top:18px;
border-radius:20px;
text-decoration:none;
font-size:19px;
font-weight:700;
color:white;
background:linear-gradient(135deg,#1b1b1b,#0d0d0d);
border:1px solid rgba(212,175,55,.18);
position:relative;
overflow:hidden;
transition:.35s;
box-shadow:0 0 18px rgba(0,0,0,.45);
}

.btn::before{
content:'';
position:absolute;
width:0%;
height:100%;
left:0;
top:0;
background:linear-gradient(to right,#d4af37,#f3dd98);
transition:.4s;
z-index:0;
}

.btn span{
position:relative;
z-index:1;
}

.btn:hover::before{
width:100%;
}

.btn:hover{
color:#000;
transform:translateY(-4px);
box-shadow:0 0 30px rgba(212,175,55,.28);
}

/* الرقم */

.phone{
margin-top:25px;
font-size:24px;
font-weight:800;
color:#d4af37;
text-shadow:0 0 12px rgba(212,175,55,.35);
}

/* الفوتر */

footer{
padding:35px 10px;
text-align:center;
font-size:15px;
color:#777;
}

/* الأنيميشن */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* الموبايل */

@media(max-width:600px){

.hero{
height:340px;
}

.logo{
width:165px;
height:165px;
}

.title{
font-size:44px;
}

.subtitle{
font-size:22px;
}

.section-title{
font-size:34px;
}

}

</style>
</head>
