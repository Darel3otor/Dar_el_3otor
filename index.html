<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
scroll-behavior:smooth;
}

body{
background:#020202;
overflow-x:hidden;
color:white;
}

/* خلفية فخمة متحركة */

body::before{
content:'';
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at top left,#d4af3715,transparent 30%),
radial-gradient(circle at bottom right,#d4af3710,transparent 35%),
#020202;
z-index:-5;
animation:bg 10s infinite alternate ease-in-out;
}

@keyframes bg{
100%{
transform:scale(1.08);
}
}

/* الهيرو */

.hero{
height:100vh;
background:
linear-gradient(to bottom,rgba(0,0,0,.2),rgba(0,0,0,.95)),
url('banner.png');
background-size:cover;
background-position:center;
position:relative;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* إضاءة */

.glow{
position:absolute;
width:700px;
height:700px;
background:radial-gradient(circle,#d4af3725,transparent 70%);
filter:blur(10px);
animation:rotate 15s linear infinite;
}

@keyframes rotate{
100%{
transform:rotate(360deg);
}
}

/* Particles */

.particle{
position:absolute;
background:#d4af37;
border-radius:50%;
opacity:.18;
animation:float 6s infinite ease-in-out;
}

.p1{
width:8px;
height:8px;
top:20%;
left:15%;
}

.p2{
width:12px;
height:12px;
bottom:18%;
right:12%;
animation-delay:2s;
}

.p3{
width:6px;
height:6px;
top:55%;
right:20%;
animation-delay:4s;
}

@keyframes float{
50%{
transform:translateY(-25px);
}
}

/* المحتوى */

.content{
position:relative;
z-index:10;
text-align:center;
padding:20px;
animation:fadeUp 1.5s ease;
}

/* اللوجو */

.logo{
width:220px;
height:220px;
border-radius:50%;
border:5px solid #d4af37;
object-fit:cover;
box-shadow:
0 0 30px rgba(212,175,55,.55),
0 0 80px rgba(212,175,55,.22);
transition:.5s;
animation:logoGlow 3s infinite alternate;
}

.logo:hover{
transform:scale(1.05);
}

@keyframes logoGlow{
100%{
box-shadow:
0 0 45px rgba(212,175,55,.8),
0 0 100px rgba(212,175,55,.4);
}
}

/* النصوص */

.brand{
font-size:78px;
font-weight:800;
margin-top:28px;
color:#d4af37;
text-shadow:0 0 35px rgba(212,175,55,.35);
letter-spacing:2px;
}

.slogan{
font-size:30px;
margin-top:10px;
color:#f3dfaa;
font-weight:600;
letter-spacing:3px;
}

.desc{
margin:25px auto 0;
max-width:700px;
line-height:2.2;
font-size:18px;
color:#d0d0d0;
}

/* العنوان */

.address{
margin-top:18px;
font-size:18px;
color:#b7b7b7;
line-height:2;
}

/* خط ذهبي */

.line{
width:180px;
height:3px;
background:linear-gradient(to right,transparent,#d4af37,transparent);
margin:35px auto;
border-radius:30px;
animation:lineGlow 2s infinite;
}

@keyframes lineGlow{
50%{
opacity:.5;
transform:scaleX(1.15);
}
}

/* الأزرار */

.buttons{
display:flex;
flex-direction:column;
align-items:center;
gap:18px;
margin-top:25px;
}

.btn{
width:340px;
max-width:92%;
padding:19px;
border-radius:20px;
text-decoration:none;
font-size:19px;
font-weight:700;
color:white;
background:rgba(15,15,15,.88);
border:1px solid rgba(212,175,55,.22);
backdrop-filter:blur(12px);
position:relative;
overflow:hidden;
transition:.4s;
box-shadow:
0 0 18px rgba(0,0,0,.55),
0 0 20px rgba(212,175,55,.05);
}

.btn::before{
content:'';
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
transition:.7s;
}

.btn:hover::before{
left:100%;
}

.btn:hover{
transform:translateY(-6px) scale(1.02);
border-color:#d4af37;
box-shadow:
0 0 30px rgba(212,175,55,.25),
0 0 60px rgba(212,175,55,.12);
color:#d4af37;
}

/* رقم */

.phone{
margin-top:32px;
font-size:26px;
font-weight:800;
color:#d4af37;
text-shadow:0 0 18px rgba(212,175,55,.4);
}

/* فوتر */

footer{
padding:30px 15px;
text-align:center;
font-size:15px;
color:#777;
background:#050505;
border-top:1px solid rgba(212,175,55,.08);
}

/* دخول */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(50px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* موبايل */

@media(max-width:700px){

.hero{
height:auto;
padding:90px 0;
}

.logo{
width:170px;
height:170px;
}

.brand{
font-size:48px;
}

.slogan{
font-size:22px;
}

.desc{
font-size:16px;
line-height:2;
}

.address{
font-size:16px;
}

}

</style>
