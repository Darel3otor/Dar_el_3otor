    .logo {

      height: 180px;
      border-radius: 50%;
      border: 5px solid #d4af37;
      box-shadow: 0 0 35px rgba(212,175,55,.55);
      object-fit: cover;
      background: #111;
    }

    .container {
      width: 90%;

    }

    .line {
      width: 120px;
      height: 3px;
      background: linear-gradient(to right, transparent, #d4af37, transparent);
      margin: 25px auto;
      border-radius: 20px;
    }

    .section-title {
      color: #d4af37;
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .contact-box {
      background: linear-gradient(145deg, #111, #0a0a0a);
      border: 1px solid rgba(212,175,55,.18);
      border-radius: 28px;
      padding: 30px 22px;
      margin-top: 30px;
      box-shadow: 0 0 25px rgba(212,175,55,.08);
      backdrop-filter: blur(8px);
    }

    .contact-box h3 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .contact-box p {
      color: #bdbdbd;
      margin-bottom: 25px;
      line-height: 1.8;

    .btn {

      display: flex;

      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, #1c1c1c, #111);
      border: 1px solid rgba(212,175,55,.25);
      padding: 16px;
      margin-top: 16px;
      border-radius: 18px;
      font-size: 18px;
      font-weight: 700;
      transition: .3s ease;
      box-shadow: 0 0 15px rgba(0,0,0,.4);
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: #d4af37;
      box-shadow: 0 0 25px rgba(212,175,55,.25);
      color: #d4af37;
    }

    .phone {
      color: #d4af37;

    }

    footer {

      }

      }
